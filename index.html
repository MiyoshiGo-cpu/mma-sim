  --text: #eae4d8; --light: #f4e7c8; --red: #d63b2b; --blue: #3b73d6; --gold: #d8a94a; --pos: #9fd38a;
  --f-disp: 'Dela Gothic One', 'Hiragino Kaku Gothic StdN', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  --f-num: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --f-body: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink: #0e1218; --panel: #161b23; --text: #eae4d8; } }
:root[data-theme="dark"] { --ink: #0e1218; --panel: #161b23; --text: #eae4d8; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--ink);
  background-image:
    radial-gradient(ellipse 70% 40% at 50% -8%, rgba(244, 231, 200, .16), transparent 70%),
    repeating-linear-gradient(45deg, rgba(138, 148, 163, .045) 0 1.2px, transparent 1.2px 22px),
    repeating-linear-gradient(-45deg, rgba(138, 148, 163, .045) 0 1.2px, transparent 1.2px 22px);
  background-attachment: fixed;
  color: var(--text); font-family: var(--f-body); font-size: 15px; line-height: 1.65;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
.wrap { max-width: 540px; margin: 0 auto; padding: 16px 14px 32px; }
.wrap.game { padding-bottom: 96px; }
.num { font-family: var(--f-num); font-weight: 600; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
.muted { color: var(--steel); font-size: 13.5px; margin: 6px 0; }
.mini { color: var(--steel); font-size: 12px; margin: 6px 0 0; display: block; }
.hint { color: var(--light); font-size: 14px; margin: 6px 0 10px; }
.warn { color: #ffb4a8; background: rgba(214, 59, 43, .12); border-left: 3px solid var(--red); padding: 8px 10px; font-size: 13.5px; margin: 8px 0; }
.ok { color: var(--pos); font-size: 13.5px; margin: 8px 0; }
.flash { background: var(--panel2); border-left: 3px solid var(--light); padding: 8px 10px; font-size: 13.5px; margin: 0 0 10px; }
.neg { color: #ff8f80; } .pos { color: var(--pos); }
.h2 { font-family: var(--f-body); font-weight: 700; font-size: 15px; margin: 0 0 10px; color: var(--light); display: block; }

/* buttons */
.btn {
  font: inherit; font-weight: 700; font-size: 14px; color: var(--text); background: var(--panel2);
  border: 1px solid var(--line); border-radius: 4px; padding: 10px 14px; cursor: pointer; min-height: 42px;
}
.btn:hover { border-color: var(--steel); }
.btn:focus-visible, .chip:focus-visible, .tab:focus-visible, .bgcard:focus-visible, .input:focus-visible, .code:focus-visible { outline: 2px solid var(--light); outline-offset: 2px; }
.btn:disabled { opacity: .35; cursor: default; }
.btn-main { background: var(--light); color: #161208; border-color: var(--light); }
.btn-main:hover { background: #fff3d8; }
.btn-danger { background: var(--red); border-color: var(--red); color: #fff; }
.btn-ghost { background: transparent; }
.btn-wide { width: 100%; display: block; margin-top: 10px; }
.btn-sm { min-height: 34px; padding: 6px 10px; font-size: 13px; }
.btn-xs { min-height: 30px; min-width: 32px; padding: 2px 8px; font-size: 14px; }
.btn-fight { background: var(--red); border-color: var(--red); color: #fff; font-family: var(--f-disp); font-weight: 400; font-size: 17px; letter-spacing: .08em; min-height: 52px; }
.stack .btn-wide:first-child { margin-top: 0; }

/* panels */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; margin: 0 0 12px; }
.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }

/* hero */
.hero { position: relative; overflow: hidden; padding: 48px 18px 26px; margin: -16px -14px 16px; text-align: left; }
.hero-light {
  position: absolute; inset: -40px 0 auto; height: 460px; pointer-events: none;
  background: conic-gradient(from 180deg at 62% 0%, transparent 162deg, rgba(244, 231, 200, .22) 176deg, rgba(244, 231, 200, .3) 180deg, rgba(244, 231, 200, .22) 184deg, transparent 198deg);
  filter: blur(6px);
}
.hero-title { position: relative; font-family: var(--f-disp); font-weight: 400; font-size: clamp(44px, 14vw, 68px); line-height: 1.02; margin: 0 0 18px; color: var(--light); letter-spacing: -.01em; text-shadow: 0 0 40px rgba(244, 231, 200, .25); }
.hero-copy { position: relative; color: var(--text); margin: 0 0 22px; font-size: 15px; }
.hero .btn-main { position: relative; font-size: 16px; min-height: 50px; padding: 12px 22px; }

.saves { list-style: none; margin: 0; padding: 0; }
.save { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); }
.save:first-child { border-top: 0; padding-top: 0; }
.save-name { font-weight: 700; }
.save-main { min-width: 0; }
.save-btns { display: flex; gap: 6px; flex-shrink: 0; }
.input, .code { width: 100%; font: inherit; color: var(--text); background: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; }
.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; word-break: break-all; resize: vertical; }

/* create */
.bgs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.bgcard { font: inherit; text-align: left; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.bgcard.on { border-color: var(--light); box-shadow: inset 0 0 0 1px var(--light); background: #232a35; }
.bg-name { font-weight: 700; font-size: 14.5px; }
.bg-age { font-family: var(--f-num); color: var(--gold); font-size: 13px; }
.bg-desc { color: var(--steel); font-size: 12px; line-height: 1.5; }
@media (max-width: 360px) { .bgs { grid-template-columns: 1fr; } }
.cand-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.cand-name { font-family: var(--f-disp); font-size: 22px; color: var(--light); }
.badge { border: 1px solid var(--gold); color: var(--gold); border-radius: 3px; padding: 2px 8px; font-size: 12.5px; white-space: nowrap; }
.kgrow { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.kgrow > span { color: var(--steel); font-size: 13.5px; margin-right: auto; }
.big { font-size: 28px; min-width: 76px; text-align: center; }
.big small { font-size: 14px; margin-left: 2px; color: var(--steel); }

/* stats */
.stats { display: flex; flex-direction: column; gap: 7px; }
.stat { display: grid; grid-template-columns: 76px 22px 1fr 30px auto; align-items: center; gap: 8px; font-size: 13.5px; }
.stat-n { color: var(--text); white-space: nowrap; }
.stat-v { font-family: var(--f-num); font-weight: 600; text-align: right; font-size: 16px; }
.bar { height: 6px; background: var(--ink); border-radius: 1px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, #b9ab8a, var(--light)); }
.pm { display: flex; align-items: center; gap: 4px; }
.pm b { font-family: var(--f-num); color: var(--gold); width: 20px; text-align: center; }
.lt { font-family: var(--f-num); font-weight: 700; font-size: 15px; display: inline-block; width: 22px; text-align: center; border-radius: 2px; line-height: 20px; }
.lt-S { background: var(--gold); color: #1a1406; } .lt-A { color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.lt-B { color: var(--light); } .lt-C { color: #cfd6de; } .lt-D { color: #aab3be; } .lt-E { color: var(--steel); } .lt-F, .lt-G { color: #6c7481; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 13px; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 3px; padding: 7px 10px; cursor: pointer; min-height: 36px; }
.chip small { font-family: var(--f-num); color: var(--steel); margin-left: 4px; font-size: 12px; }
.chip.on { background: var(--light); color: #161208; border-color: var(--light); }
.chip.on small { color: #5a4f38; }
.chip:disabled { opacity: .35; cursor: default; }

/* hud */
.hud { position: relative; margin: 0 -14px 12px; padding: 12px 14px 12px; background: rgba(14, 18, 24, .94); border-bottom: 1px solid var(--line); }
.hud-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.hud-name { font-family: var(--f-disp); font-size: 19px; color: var(--light); line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hud-date { color: var(--steel); font-size: 14px; white-space: nowrap; }
.hud-profile { display: flex; align-items: center; gap: 12px; margin: 8px 0 10px; }
.hud-age { display: flex; align-items: baseline; gap: 2px; padding: 2px 12px 2px 0; border-right: 1px solid var(--line); flex-shrink: 0; }
.hud-age b { font-size: 34px; line-height: 1; color: var(--light); font-weight: 700; }
.hud-age span { font-size: 14px; color: var(--text); font-weight: 700; }
.hud-tags { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.hud-chip { font-size: 12.5px; border: 1px solid var(--line); border-radius: 3px; padding: 1px 8px; background: var(--panel2); white-space: nowrap; }
.belt { color: #1a1406; background: var(--gold); border-radius: 2px; padding: 0 6px; font-size: 12px; font-weight: 700; }
.hud-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.hud-grid > div { display: flex; flex-direction: column; min-width: 0; }
.k { color: var(--steel); font-size: 11.5px; line-height: 1.3; }
.hud-grid b { font-size: 17px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fame { display: block; height: 3px; background: var(--ink); margin-top: 3px; }
.fame i { display: block; height: 100%; background: var(--gold); }

/* offers */
.offers { display: flex; flex-direction: column; gap: 10px; }
.offer { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 12px; }
.offer-title { border-color: var(--gold); box-shadow: inset 3px 0 0 var(--gold); }
.offer-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
.offer-ev { color: var(--text); }
.offer-date { margin-left: auto; color: var(--steel); font-size: 14px; }
.ptag { font-family: var(--f-num); font-weight: 700; font-size: 13px; padding: 1px 7px; border-radius: 2px; background: #2a313c; color: var(--text); white-space: nowrap; }
.p-ufc { background: #b3261e; color: #fff; } .p-rizin { background: #e8e1d2; color: #111; } .p-one { background: #c9a13b; color: #1a1406; }
.p-pfl { background: #27427a; color: #fff; } .p-rtu, .p-dwcs { background: #5e1a16; color: #fff; } .p-ama { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--steel); }
.tags { display: flex; gap: 6px; margin: 8px 0 0; flex-wrap: wrap; }
.tag { font-size: 11.5px; border: 1px solid var(--line); color: var(--steel); border-radius: 2px; padding: 0 6px; margin-left: 4px; white-space: nowrap; }
.tags .tag { margin-left: 0; }
.tag-gold { border-color: var(--gold); color: var(--gold); }
.tag-red { border-color: var(--red); color: #ff8f80; }
.offer-opp { display: flex; align-items: baseline; gap: 8px; margin: 8px 0 0; }
.vs { font-family: var(--f-num); color: var(--blue); font-weight: 700; }
.opp-name { font-weight: 700; font-size: 17px; }
.opp-meta { color: var(--steel); font-size: 12.5px; }
.offer-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 0; font-size: 13px; }
.offer-grid > div { display: flex; flex-direction: column; min-width: 0; }
.offer-grid b { font-weight: 500; }
.offer-note { font-size: 13px; margin: 8px 0 0; color: var(--light); }
@media (max-width: 380px) { .offer-grid { grid-template-columns: 1fr 1fr; } }
.gap { font-size: 12px; font-weight: 700; }
.gap-up { color: #ff8f80; } .gap-down { color: var(--pos); } .gap-even { color: var(--light); } .gap-mid { color: var(--gold); }
.confirm { border: 1px solid var(--red); padding: 10px; border-radius: 4px; margin-top: 10px; }
.confirm p { margin: 0 0 8px; font-size: 13.5px; }
.confirm .btn { margin-right: 6px; }

.news, .rivals, .events, .gains, .kv, .ranks, .hist, .tl { list-style: none; margin: 0; padding: 0; }
.news li { font-size: 13.5px; padding: 6px 0; border-top: 1px solid var(--line); }
.news li:first-child { border-top: 0; padding-top: 0; }
.news-d { color: var(--steel); margin-right: 8px; font-size: 13px; }
.rival { padding: 8px 0; border-top: 1px solid var(--line); }
.rival:first-child { border-top: 0; padding-top: 0; }
.rival-top { display: flex; gap: 8px; align-items: center; }
.heat { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.heatbar { flex: 1; height: 4px; background: var(--ink); }
.heatbar i { display: block; height: 100%; background: var(--red); }
.heatbar.dmg i { background: linear-gradient(90deg, var(--gold), var(--red)); }

/* fight card */
.card-vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; gap: 0; }
.corner { display: flex; flex-direction: column; gap: 1px; padding: 10px; font-size: 12.5px; color: var(--steel); min-width: 0; }
.corner b { color: var(--text); font-size: 15px; line-height: 1.3; word-break: break-all; }
.corner .num { color: var(--text); font-size: 15px; }
.corner-red { border-left: 3px solid var(--red); background: linear-gradient(90deg, rgba(214, 59, 43, .16), transparent); }
.corner-blue { border-right: 3px solid var(--blue); background: linear-gradient(270deg, rgba(59, 115, 214, .16), transparent); text-align: right; align-items: flex-end; }
.corner-lab { font-size: 11px; }
.vsmark { font-family: var(--f-disp); color: var(--light); align-self: center; padding: 0 8px; font-size: 18px; }
.card-ev { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; font-size: 13px; }

fieldset.opt { border: 0; padding: 0; margin: 0 0 12px; }
fieldset.opt legend { font-size: 13px; color: var(--steel); padding: 0; margin-bottom: 6px; }
.sum-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sum-grid > div { display: flex; flex-direction: column; }
.sum-grid b { font-size: 15px; }
.sum-grid .num { font-size: 20px; }

.gains { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; margin-bottom: 8px; }
.gains li { display: flex; justify-content: space-between; font-size: 13.5px; border-bottom: 1px dashed var(--line); padding: 3px 0; }
.gains b { font-size: 16px; }
.events li { font-size: 13.5px; padding: 5px 0 5px 14px; position: relative; }
.events li::before { content: ''; position: absolute; left: 0; top: 13px; width: 6px; height: 1px; background: var(--steel); }
.events li.hot { color: #ff8f80; }
.press blockquote { margin: 0 0 8px; padding: 10px 12px; background: var(--ink); border-left: 3px solid var(--light); font-size: 15px; }
.press p { margin: 6px 0 0; font-size: 13.5px; }
.weigh { text-align: center; }
.weigh .h2 { text-align: left; }
.scale { font-family: var(--f-num); color: var(--light); }
.scale b { font-size: 64px; line-height: 1; font-weight: 700; }
.scale span { font-size: 22px; margin-left: 4px; }
.scale-lim { color: var(--steel); margin: 2px 0 0; font-size: 13px; }
.weigh-fail .scale { color: #ff8f80; }

/* result */
.result, .retire { position: relative; overflow: hidden; text-align: center; padding: 26px 14px 22px; margin: 0 0 12px; border: 1px solid var(--line); border-radius: 6px; background: #0a0d12; }
.r-light { position: absolute; left: 50%; top: -60px; width: 420px; height: 320px; transform: translateX(-50%); background: radial-gradient(ellipse at 50% 20%, rgba(244, 231, 200, .32), transparent 65%); pointer-events: none; }
.r-loss .r-light { background: radial-gradient(ellipse at 50% 20%, rgba(138, 148, 163, .16), transparent 65%); }
.r-ev { position: relative; display: flex; justify-content: center; gap: 8px; align-items: center; font-size: 13px; color: var(--steel); flex-wrap: wrap; }
.r-word { position: relative; font-family: var(--f-disp); font-size: clamp(56px, 20vw, 88px); line-height: 1.1; margin: 10px 0 4px; color: var(--light); text-shadow: 0 0 40px rgba(244, 231, 200, .35); }
.r-loss .r-word { color: #9aa3b0; text-shadow: none; }
.r-draw .r-word { color: var(--text); font-size: clamp(40px, 13vw, 64px); }
.r-method { position: relative; font-size: 15px; font-weight: 700; }
.r-opp { position: relative; color: var(--steel); font-size: 13.5px; }
.r-belt { position: relative; display: inline-block; margin-top: 10px; background: var(--gold); color: #1a1406; font-weight: 700; padding: 3px 12px; border-radius: 2px; }
.r-belt-lost { background: transparent; color: #ff8f80; border: 1px solid var(--red); }
.tl li { display: grid; grid-template-columns: 62px 1fr; gap: 8px; font-size: 13.5px; padding: 6px 0; border-top: 1px solid var(--line); }
.tl li:first-child { border-top: 0; }
.tl-t { color: var(--steel); font-size: 14px; }
.tl-fin { color: var(--light); font-weight: 700; }
.st-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.st-table td, .st-table th { padding: 6px 4px; border-top: 1px solid var(--line); }
.st-table thead td { border-top: 0; font-weight: 700; font-size: 13px; }
.st-table td:first-child { text-align: left; } .st-table td:last-child { text-align: right; }
.st-table th { color: var(--steel); font-weight: 500; text-align: center; }
.st-table td.num { font-size: 17px; }
.c-red { color: #ff8f80; } .c-blue { color: #8fb3ff; }

.r-anim .r-word { animation: stamp .5s cubic-bezier(.2, 1.4, .4, 1) 2.05s both; }
@keyframes stamp { from { transform: scale(1.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.walkout { position: fixed; inset: 0; z-index: 50; background: #050608; display: flex; align-items: center; justify-content: center; animation: wo-out .45s ease 1.7s forwards; pointer-events: none; overflow: hidden; }
.wo-cone { position: absolute; left: 50%; top: -10%; width: 140%; height: 120%; transform: translateX(-50%); background: conic-gradient(from 180deg at 50% 0%, transparent 160deg, rgba(244, 231, 200, .28) 180deg, transparent 200deg); animation: cone 1.7s ease-in-out both; }
.wo-in { position: relative; text-align: center; padding: 0 20px; }
.wo-ev { color: var(--steel); font-size: 13px; margin-bottom: 18px; animation: fadein .4s ease .1s both; }
.wo-n { font-family: var(--f-disp); font-size: clamp(24px, 8vw, 36px); line-height: 1.25; }
.wo-red { color: #ff8f80; animation: fromL .5s ease .3s both; }
.wo-blue { color: #8fb3ff; animation: fromR .5s ease .55s both; }
.wo-vs { font-family: var(--f-num); font-weight: 700; color: var(--light); font-size: 20px; margin: 6px 0; animation: fadein .3s ease .5s both; }
@keyframes wo-out { to { opacity: 0; visibility: hidden; } }
@keyframes cone { 0% { opacity: 0; transform: translateX(-80%) rotate(-12deg); } 60% { opacity: 1; } 100% { opacity: 1; transform: translateX(-50%) rotate(0); } }
@keyframes fromL { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: none; } }
@keyframes fromR { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .walkout { display: none; } .r-anim .r-word { animation: none; } }

.retire-title { position: relative; font-family: var(--f-disp); font-weight: 400; font-size: clamp(34px, 11vw, 52px); line-height: 1.15; margin: 8px 0; color: var(--light); }
.retire-sub { position: relative; margin: 0; }
.retire-rec, .recbig { position: relative; font-size: 54px; line-height: 1.1; color: var(--light); margin-top: 8px; }
.retire-rec small, .recbig small { font-family: var(--f-body); font-size: 16px; margin: 0 8px 0 2px; color: var(--steel); }
.recbig { font-size: 46px; }
.belt-line { color: var(--gold); font-size: 13.5px; margin: 8px 0 0; }

.kv li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.kv li:first-child { border-top: 0; padding-top: 0; }
.kv b { font-weight: 600; }
.kv b.num { font-size: 16px; }

.ranks { margin-top: 10px; }
.rk { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; padding: 6px 4px; border-top: 1px solid var(--line); font-size: 13.5px; }
.rk-n { color: var(--steel); font-size: 16px; text-align: center; }
.rk-champ .rk-n { color: #1a1406; background: var(--gold); border-radius: 2px; }
.rk-me { background: rgba(214, 59, 43, .14); box-shadow: inset 3px 0 0 var(--red); }
.rk-me .rk-name { font-weight: 700; }
.rk-rec { color: var(--steel); font-size: 14px; }
.hist-i { display: grid; grid-template-columns: 32px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.hist-i:first-child { border-top: 0; padding-top: 0; }
.res { font-weight: 700; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 2px; font-size: 13px; }

      flash = `${lr.months}ヶ月の休養を終えました。${top2.length ? `${top2.map(([k, v]) => `${E.STAT_NAME[k]} +${v.toFixed(1)}`).join('、')}と、試合の経験が身についています。` : ''}`;
    }
    App.ui = flash ? { flash } : {}; App.save(); top();
  },
  rankPromo(d) { App.ui.rankPromo = d.id; App.ui.rankAll = false; },
  rankAll() { App.ui.rankAll = !App.ui.rankAll; },
  showCode() { App.ui.code = E.toCode(App.st); },
  saveFile() {
    try {
      const d = new Date(), stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
      const blob = new Blob([E.toCode(App.st)], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `格闘家_${App.st.name.replace(/[\\/:*?"<>|\s]+/g, '')}_${stamp}.txt`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      App.ui.copied = 'ファイルを書き出しました。';
    } catch (e) { App.ui.copied = '書き出せませんでした。引き継ぎコードをコピーして保管してください。'; }
  },
  copyCode() {
    const el = document.getElementById('exportCode');
    const done = (ok) => { App.ui.copied = ok ? 'コピーしました。' : 'コピーできなかったので、枠内を長押しして選択してください。'; render(); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(App.ui.code).then(() => done(true), () => { selectFallback(el); done(false); }); return 'async'; }
    } catch (e) { /* fall through */ }
    selectFallback(el); done(false); return 'async';
  },
};
function selectFallback(el) { if (!el) return; try { el.focus(); el.select(); document.execCommand && document.execCommand('copy'); } catch (e) { /* noop */ } }
function readName() { const el = document.getElementById('pname'); return el ? el.value.trim().slice(0, 14) : (App.ui.create ? App.ui.create.name : ''); }

root.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.a];
  if (!fn) return;
  ev.preventDefault();
  const r = fn(el.dataset);
  if (r !== 'async') render();
});
root.addEventListener('input', (ev) => {
  if (ev.target.id === 'pname' && App.ui.create) App.ui.create.name = ev.target.value;
  if (ev.target.id === 'potRange' && App.ui.create) { App.ui.create.manual.base = Number(ev.target.value); const v = document.getElementById('potVal'); if (v) v.textContent = ev.target.value; }
});
root.addEventListener('change', (ev) => {
  if (ev.target.id === 'importFile' && ev.target.files && ev.target.files[0]) {
    const fr = new FileReader();
    fr.onload = () => {
      try { const st = E.migrate(E.fromCode(String(fr.result))); App.st = st; App.save(); App.screen = 'game'; App.tab = 'home'; App.ui = {}; top(); }
      catch (e) { App.ui.importMsg = 'このファイルは読み込めませんでした。書き出したセーブファイルを選んでください。'; }
      render();
    };
    fr.onerror = () => { App.ui.importMsg = 'ファイルを開けませんでした。'; render(); };
    fr.readAsText(ev.target.files[0]);
    return;
  }
  if (ev.target.id === 'potRange' && App.ui.create) { App.ui.create.manual.base = Number(ev.target.value); render(); const el = document.getElementById('potRange'); if (el) el.focus(); }
});

App.render = render; App.A = A;
App.loadIndex();
render();
})();

</script>
